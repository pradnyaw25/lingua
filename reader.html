<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reader — Lingua</title>

  <meta name="description" content="Read French and Spanish texts in parallel with English, sentence by sentence. Tap any word in the target column for its meaning." />
  <link rel="canonical" href="https://pradnya.dev/lingua/reader.html" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="theme-color" content="#dccfdc" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Lingua" />
  <meta property="og:title" content="Lingua Reader — French &amp; Spanish beside English" />
  <meta property="og:description" content="Read French and Spanish texts in parallel with English, sentence by sentence. Tap any word in the target column for its meaning." />
  <meta property="og:url" content="https://pradnya.dev/lingua/reader.html" />
  <meta property="og:image" content="https://pradnya.dev/lingua/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_US" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Lingua Reader — French &amp; Spanish beside English" />
  <meta name="twitter:description" content="Read French and Spanish texts in parallel with English, sentence by sentence. Tap any word in the target column for its meaning." />
  <meta name="twitter:image" content="https://pradnya.dev/lingua/og-image.png" />
  <link rel="stylesheet" href="css/style.css?v=7" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="brand"><a href="index.html" style="color:inherit">Lingua<span>.</span></a></div>
      <nav class="nav" data-nav></nav>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="toolbar">
        <label for="text-select">Text</label>
        <select id="text-select"></select>
        <span class="spacer"></span>
        <button class="btn" id="btn-read" title="Remember that you've read this">Mark as read</button>
        <button class="btn" id="btn-swap" title="Put English first">Swap sides</button>
        <button class="btn" id="btn-hide-en">Hide English (self-test)</button>
        <label for="font-size">Size</label>
        <select id="font-size">
          <option value="s">Small</option>
          <option value="m" selected>Medium</option>
          <option value="l">Large</option>
        </select>
      </div>

      <div class="text-head" id="text-head"></div>
      <div class="parallel" id="parallel"></div>
      <p class="subtitle" style="margin-top:16px;font-size:.9rem">
        Tip: hover a sentence to sync both sides · <strong>tap any word on the left for its meaning</strong> · click the English side to pin the highlight.
      </p>
    </div>
  </main>

  <footer>
    <div class="wrap"><a href="index.html">← Back to library</a></div>
  </footer>

  <script src="data/texts.js?v=7"></script>
  <script src="data/daily.js?v=7"></script>
  <script src="data/generated.js?v=7"></script>
  <script src="data/dictionary.js?v=7"></script>
  <script src="js/app.js?v=7"></script>
  <script src="js/reader.js?v=7"></script>
</body>
</html>
