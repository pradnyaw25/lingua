<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lingua — Parallel Reading</title>
  <link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="brand">Lingua<span>.</span></div>
      <nav class="nav" data-nav></nav>
    </div>
  </header>

  <main>
    <div class="wrap">
      <h1>Read in parallel.</h1>
      <p class="subtitle">French &amp; Spanish beside English, sentence by sentence — built for advanced-beginner to intermediate readers (A2–B2). Pick a text to begin.</p>

      <div class="chipbar" id="level-bar"></div>
      <div id="library"></div>
    </div>
  </main>

  <footer>
    <div class="wrap">Personal language-learning workshop · texts are public-domain fables retold in simple prose.</div>
  </footer>

  <script src="data/texts.js"></script>
  <script src="data/daily.js"></script>
  <script src="data/generated.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      const texts = window.TEXTS || [];
      const lib = document.getElementById("library");
      const bar = document.getElementById("level-bar");
      const LEVEL_ORDER = ["A1", "A2", "B1", "B2", "C1", "C2"];
      const levels = LEVEL_ORDER.filter((l) => texts.some((t) => t.level === l));
      let active = "all";

      function card(t) {
        const a = document.createElement("a");
        a.className = "card";
        a.href = "reader.html?id=" + encodeURIComponent(t.id);
        a.innerHTML =
          '<span class="lang-tag">' + t.langLabel + '</span>' +
          '<h3>' + t.title + '</h3>' +
          '<p class="meta">' + t.pairs.length + ' sentences · ' + (t.level || '') + '</p>';
        return a;
      }

      function render() {
        bar.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c.dataset.lvl === active));
        const shown = texts.filter((t) => active === "all" || t.level === active);
        lib.innerHTML = "";
        if (!shown.length) { lib.innerHTML = '<p class="empty">No texts at this level yet.</p>'; return; }
        const byLang = {};
        shown.forEach((t) => { (byLang[t.langLabel] = byLang[t.langLabel] || []).push(t); });
        Object.keys(byLang).forEach((label) => {
          const h = document.createElement("p");
          h.className = "section-label";
          h.textContent = label;
          lib.appendChild(h);
          const grid = document.createElement("div");
          grid.className = "card-grid";
          byLang[label].forEach((t) => grid.appendChild(card(t)));
          lib.appendChild(grid);
        });
      }

      function chip(lvl, label) {
        const b = document.createElement("button");
        b.className = "chip";
        b.dataset.lvl = lvl;
        b.textContent = label;
        b.addEventListener("click", () => { active = lvl; render(); });
        return b;
      }

      bar.appendChild(chip("all", "All levels (" + texts.length + ")"));
      levels.forEach((l) => bar.appendChild(chip(l, l + " (" + texts.filter((t) => t.level === l).length + ")")));
      render();
    })();
  </script>
</body>
</html>
