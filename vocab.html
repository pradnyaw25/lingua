<body>
  <header class="site-header">
    <div class="wrap">
      <div class="brand"><a href="index.html" style="color:inherit">Lingua<span>.</span></a></div>
      <nav class="nav" data-nav></nav>
    </div>
  </header>

  <main>
    <div class="wrap">
      <h1>Frequency words</h1>
      <p class="subtitle">The most common words first. Mark the ones you know — progress is saved on this device.</p>

      <div class="toolbar">
        <div id="lang-tabs" style="display:flex;gap:8px"></div>
        <span class="spacer"></span>
        <input type="search" id="vocab-search" placeholder="Search word or meaning…" />
        <label for="known-filter">Show</label>
        <select id="known-filter">
          <option value="all">All</option>
          <option value="unknown">Not yet known</option>
        </select>
      </div>

      <div class="chipbar" id="cat-bar"></div>

      <p class="vocab-stats" id="vocab-stats"></p>
      <table class="vocab">
        <thead>
          <tr><th class="col-rank">#</th><th>Word</th><th>English</th><th class="col-type">Type</th><th>Known</th></tr>
        </thead>
        <tbody id="vocab-body"></tbody>
      </table>
    </div>
  </main>

  <footer>
    <div class="wrap">1,000 most-frequent words per language (OpenSubtitles frequency data). Blank English cells still need a translation.</div>
  </footer>

  <script src="data/vocab.js?v=7"></script>
  <script src="data/categories.js?v=7"></script>
  <script src="js/app.js?v=7"></script>
  <script src="js/vocab.js?v=7"></script>
</body>
